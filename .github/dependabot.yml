version: 2
updates:
  - package-ecosystem: "terraform"
    directory: "/tf-cosmosdb"
    schedule:
      interval: "cron"
      cronjob: "0 7 * * *"    # 12:30 PM IST
    open-pull-requests-limit: 1

  - package-ecosystem: "terraform"
    directory: "/tf-hcl"
    schedule:
      interval: "cron"
      cronjob: "0 8 * * *"    # 1:30 PM IST
    open-pull-requests-limit: 1
