    uses: tandemdiabetes/gh-actions-reusable-workflows/.github/workflows/wiz_iac_scan.yml@v3.3.1
    with:
      environment: eusit-plan
      target_env: eusit
      workflow_name: tf-cosmosdb.yml
      storage_account_name: stgeneralscripts
    secrets:
      wiz_client_id: ${{ secrets.WIZ_CLIENT_ID }}
      wiz_client_secret: ${{ secrets.WIZ_CLIENT_SECRET }}
      wiz_pr_msteams_webhook: ${{ secrets.WIZ_PR_MSTEAMS_WEBHOOK }}
