name: dependabot-test-workflow

on:
  push:
    branches:
      - 'dependabot/**'
      - 'feature/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Print trigger info
        run: |
          echo "Workflow triggered!"
          echo "Branch: $GITHUB_REF"
          echo "Actor: $GITHUB_ACTOR"
