  wizscan_usprd:
    name: wiz scan usprd
    needs: [detect_changes, terraform_operations]
    if: |
      needs.detect_changes.outputs.usprd == 'true' && 
      needs.detect_changes.outputs.multiple_envs != 'true' &&
      needs.terraform_operations.outputs.usprd_plan_succeeded == 'true'
    uses: tandemdiabetes/gh-actions-reusable-workflows/.github/workflows/wiz_iac_scan.yml@v3.3.1
    with:
      environment: usprd-plan
      target_env: usprd
      workflow_name: tf-cosmosdb.yml
      storage_account_name: stgeneralscripts
    secrets:
      wiz_client_id: ${{ secrets.WIZ_CLIENT_ID }}
      wiz_client_secret: ${{ secrets.WIZ_CLIENT_SECRET }}
